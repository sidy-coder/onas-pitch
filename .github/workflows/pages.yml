# Construit la présentation et la publie sur GitHub Pages à chaque push sur main.
#
# BASE_PATH est indispensable ici : le site est servi depuis
# https://sidy-coder.github.io/onas-pitch/ et non depuis une racine de domaine.
# Sans lui la page se charge, mais tous les liens et visuels pointent une case
# trop haut — panne silencieuse, rien n'échoue au build.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Construire le site statique
        env:
          BASE_PATH: /onas-pitch
          NEXT_PUBLIC_SITE_URL: https://onas.sn
        run: npm run build

      # Sans ce fichier, Pages passe la sortie à Jekyll, qui ignore tout dossier
      # commençant par un souligné — donc _next/, donc tout le CSS et le JS.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
